name: Bug report
description: Report a reproducible problem using synthetic data.
body:
  - type: markdown
    attributes:
      value: Report vulnerabilities privately using SECURITY.md. Do not attach voice recordings, transcripts, credentials, or accessibility contents.
  - type: input
    id: revision
    attributes:
      label: Source revision or release version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS version and architecture
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected behavior, and actual behavior
    validations:
      required: true
