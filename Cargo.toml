[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri"]
default-members = ["crates/fnpilot-core", "crates/fnpilot-cli", "crates/fnpilot-runtime", "crates/fnpilot-platform", "crates/fnpilot-speech", "crates/fnpilot-bench"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
regex = "=1.12.2"
sha2 = "=0.10.9"
fnpilot-core = { path = "crates/fnpilot-core" }
fnpilot-platform = { path = "crates/fnpilot-platform" }
fnpilot-runtime = { path = "crates/fnpilot-runtime" }
fnpilot-speech = { path = "crates/fnpilot-speech" }
