[package]
name = "fnpilot-platform"
links = "FnPilotSpeech"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
fnpilot-core.workspace = true
base64 = "=0.22.1"
png = "=0.18.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_ProcessStatus", "Win32_Graphics_Gdi", "Win32_System_StationsAndDesktops", "Win32_UI_Shell", "Win32_System_Registry", "Win32_UI_Shell_Common", "Win32_Storage_EnhancedStorage", "Win32_Storage_Packaging_Appx"] }
winreg = "=0.55.0"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
cpal = "=0.16.0"
fnpilot-speech.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.1"
core-graphics = { version = "=0.25.0", features = ["highsierra"] }
objc2 = "=0.6.5"
objc2-foundation = "=0.3.2"
block2 = "=0.6.2"
dispatch2 = "=0.3.1"
libc = "=0.2.177"
